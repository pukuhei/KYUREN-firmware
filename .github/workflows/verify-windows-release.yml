name: Verify Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v2026.09.19-preview.1
permissions:
  contents: read
jobs:
  install-and-self-check:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download and check installer
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z._-]+$') { throw 'Invalid tag' }
          $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft) { throw 'Release is still a draft' }
          # Embedded release.assets may lag behind uploads; query assets directly.
          $assetsJson = gh api --paginate --slurp "repos/$env:GH_REPO/releases/$($release.id)/assets?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Asset lookup failed' }
          $assets = @($assetsJson | ConvertFrom-Json | ForEach-Object { $_ } | ForEach-Object { $_ })
          $wanted = @($assets | Where-Object { $_.name -match '^KYUREN-Companion-[0-9A-Za-z._-]+-Windows-x64\.exe$' -or $_.name -eq 'SHA256SUMS.txt' })
          if ($wanted.Count -ne 2) { throw 'Expected installer and checksums' }
          foreach ($asset in $wanted) {
            if ($asset.state -ne 'uploaded') { throw 'Asset is not ready' }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile (Join-Path $env:RUNNER_TEMP $asset.name)
          }
          $installers = @(Get-ChildItem $env:RUNNER_TEMP -Filter 'KYUREN-Companion-*-Windows-x64.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $name = $installers[0].Name
          $line = Get-Content "$env:RUNNER_TEMP/SHA256SUMS.txt" | Where-Object { $_ -match "  $([regex]::Escape($name))$" }
          if (@($line).Count -ne 1) { throw 'Missing installer checksum' }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP/$name" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Checksum mismatch' }
      - name: Install and verify bridge
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'kyuren-companion-electron'
          $installerFile = @(Get-ChildItem $env:RUNNER_TEMP -Filter 'KYUREN-Companion-*-Windows-x64.exe')[0].FullName
          $installer = Start-Process $installerFile -ArgumentList @('/S', '/currentuser', "/D=$destination") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Installer exit $($installer.ExitCode)" }
          $apps = @(Get-ChildItem $destination -Filter 'KYUREN Companion.exe' -Recurse -ErrorAction SilentlyContinue)
          if ($apps.Count -ne 1) {
            Get-ChildItem $destination -Recurse -ErrorAction SilentlyContinue | Select-Object -First 25 FullName
            Get-ChildItem "$env:LOCALAPPDATA/Programs" -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            throw 'Installed app not found at the requested destination'
          }
          $destination = $apps[0].DirectoryName
          $model = Join-Path $destination 'resources/bin/Models/ggml-small.bin'
          if ((Get-Item $model).Length -ne 487601967) { throw 'Whisper model size mismatch' }
          if ((Get-FileHash $model -Algorithm SHA256).Hash -ne '1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b') { throw 'Whisper model hash mismatch' }
          if (Test-Path "$destination/resources/bin/System.Speech.dll") { throw 'Obsolete speech engine included' }
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$destination/resources/bin/KyurenCompanionBridge.exe"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          foreach ($method in @('hello','selfCheck','snapshot','stop')) {
            $process.StandardInput.WriteLine((@{id=$method;method=$method} | ConvertTo-Json -Compress))
          }
          $process.StandardInput.Close()
          if (!$process.WaitForExit(30000)) { $process.Kill($true); throw 'Bridge timeout' }
          if ($process.ExitCode -ne 0) { throw $errors.Result }
          $lines = $output.Result -split '\r?\n' | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json }
          foreach ($method in @('hello','selfCheck','snapshot','stop')) {
            $response = $lines | Where-Object { $_.id -eq $method }
            if (!$response.ok) { throw "$method failed" }
          }
          if (($lines | Where-Object { $_.id -eq 'hello' }).result.protocol -ne 'kyuren-bridge-v1') { throw 'Unexpected protocol' }
          $check = ($lines | Where-Object { $_.id -eq 'selfCheck' }).result
          if (!$check.modelAvailable -or !$check.whisperBackendAvailable -or $check.transcriptionEngine -ne 'whisper.cpp') { throw 'Whisper model/backend unavailable' }
          Write-Output 'PASS: installer checksum, silent installation, Whisper model hash/backend loading, hello/selfCheck/snapshot/stop. Hardware workflows remain unverified.'
